# TCP server (legacy/test transport)
server.tcp.enabled=true
server.tcp.bindAddress=0.0.0.0
server.tcp.port=8888
server.backlog=100
server.workerThreads=64
server.maxFrameBytes=2097152

# WebSocket server (default JavaFX transport)
server.websocket.enabled=true
server.websocket.bindAddress=0.0.0.0
server.websocket.port=8890
server.websocket.path=/ws

# Session and reconnect
session.resumeGraceSeconds=120
session.cleanupIntervalSeconds=15

# XAMPP MySQL/MariaDB persistence (server only)
# Match db.port to the MySQL Port(s) shown in your XAMPP Control Panel.
db.driver=com.mysql.cj.jdbc.Driver
db.host=127.0.0.1
db.port=3306
db.name=btl_16
db.user=root
db.password=
db.useSsl=false
db.allowPublicKeyRetrieval=true
db.autoInitialize=true

# Security
security.passwordIterations=120000

# Auction rules
auction.antiSnipingWindowSeconds=10
auction.extensionSeconds=10
auction.timerCheckMillis=200
auction.tickBroadcastMillis=1000
auction.bidHistoryLimit=50
auction.closedVisibilitySeconds=120
