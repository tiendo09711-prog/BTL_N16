# TCP server
server.bindAddress=0.0.0.0
server.port=8888
server.backlog=100
server.workerThreads=64
server.maxFrameBytes=2097152

# Session and reconnect
session.resumeGraceSeconds=120
session.cleanupIntervalSeconds=15

# Repository: jdbc or memory
repository.mode=jdbc

# Laragon MySQL
# Database name requested by the team: btl_16
db.driver=com.mysql.cj.jdbc.Driver
db.host=127.0.0.1
db.port=3306
db.name=btl_16
db.user=root
db.password=
db.useSsl=false
db.allowPublicKeyRetrieval=true
db.autoInitialize=true

# Security
security.passwordIterations=120000

# Auction rules
auction.antiSnipingWindowSeconds=10
auction.extensionSeconds=10
auction.timerCheckMillis=200
auction.tickBroadcastMillis=1000
auction.bidHistoryLimit=50

# Demo data
demo.autoSeed=true
demo.shortAuctionSeconds=90
demo.mediumAuctionSeconds=300
demo.longAuctionSeconds=480
